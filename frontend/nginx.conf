# nginx configuration for the Orbit frontend container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Requests that start with /api are passed on to the backend container.
    # "backend" is the service name in compose.yaml; Docker's internal DNS
    # server (127.0.0.11) turns it into the backend container's IP address.
    # Using a variable makes nginx look the name up again regularly, so it
    # keeps working when the backend container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:3000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Built files have a content hash in their name, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is the React app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
